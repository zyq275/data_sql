# 数据通达 — 元数据知识库定义（阶段 4 使用）
#
# 本文件声明"数仓里有哪些表、字段、指标"，供离线构建脚本（app/scripts）写入
# MySQL table_info/column_info/metric_info/column_metric，并构建 Qdrant 向量索引
# 与 ES 全文索引。知识库通过配置扩展，不改代码（NFR-MAINT-001）。
#
# 阶段 1 仅占位，结构在阶段 4 按 TDD 第 8.2 节的数仓表定义补全。

