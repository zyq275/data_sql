# 数据通达 — 基础配置（非敏感项默认值）
#
# 优先级：环境变量 > .env > 本文件 > 代码默认值（见 app/core/config.py）
# 敏感项（数据库口令、LLM api_key、JWT secret）不写入本文件，仅经环境变量/.env 注入（NFR-SEC-003）
# 环境变量名用双下划线表示层级，如 DB_META__PASSWORD、LLM__API_KEY、JWT__SECRET_KEY

app:
  name: 数据通达
  version: 3.0.0
  debug: false
  api_prefix: /api/v1

# 元数据库（可写，承载 11 张元数据表）
db_meta:
  host: 127.0.0.1
  port: 3306
  user: root
  database: data_agent_meta
  charset: utf8mb4
  pool_size: 10
  max_overflow: 20

# 数仓库（只读账号，最小权限，ADR-004 / NFR-SEC-007）
db_dw:
  host: 127.0.0.1
  port: 3306
  user: root
  database: data_agent_dw
  charset: utf8mb4
  pool_size: 10
  max_overflow: 20

llm:
  model_name: deepseek-chat
  base_url: https://api.deepseek.com/v1
  temperature: 0.0
  timeout: 60
  max_retries: 2

# Embedding / Rerank 为独立 HTTP 服务，不在应用内做本地 CPU 推理（ADR-005）
# host 指向服务的 OpenAI 兼容根路径（即以 /v1 结尾），
# 这样 Ollama / Xinference / TEI / 各家云服务都能直接换，只改这一个地址。
embedding:
  host: http://127.0.0.1:8001/v1
  model: bge-m3
  timeout: 30

# 重排服务。重排不属于 OpenAI 兼容协议，各家路径与响应字段都不一致，
# 所以 path 单独可配：TEI / Xinference / vLLM 是 /rerank，
# SiliconFlow、Jina 等云服务是 /v1/rerank。云服务需要鉴权的，
# 用环境变量 RERANK__API_KEY 注入（敏感项不进本文件，NFR-SEC-003）。
# 没有重排服务时把 enabled 设为 false（或 RERANK__ENABLED=false）：
# 检索会自动退回 RRF 融合顺序，而不是让每次问答都白等一轮超时。
rerank:
  enabled: true
  host: http://127.0.0.1:8002
  path: /rerank
  model: bge-reranker-v2-m3
  timeout: 30
  top_n: 0

jwt:
  algorithm: HS256
  access_token_expire_minutes: 30
  refresh_token_expire_days: 7

# Qdrant：mode=server 连远程实例（生产/容器编排，TDD 14.1）；
# mode=local 用 qdrant-client 自带的嵌入式引擎（数据落 local_path，不开独立进程），
# 仅用于没有 Qdrant 服务的本地开发。两种模式 API 一致，靠 .env 覆盖切换。
qdrant:
  mode: server
  host: 127.0.0.1
  port: 6333
  local_path: ""
  embedding_size: 1024
  column_collection: data-agent-column
  metric_collection: data-agent-metric

# 三个索引各管一类（阶段 6 起）：取值、字段、指标。
# 字段/指标的全文索引是混合检索的第二路，与 Qdrant 的
# data-agent-column / data-agent-metric 两个集合一一对应。
es:
  scheme: http
  host: 127.0.0.1
  port: 9200
  value_index: data-agent-value
  column_index: data-agent-column-text
  metric_index: data-agent-metric-text

redis:
  # 会话 checkpointer（ADR-006）。置 false 则会话状态退回进程内存储：
  # 单实例开发不受影响，多实例共享与重启恢复失效
  enabled: true
  host: 127.0.0.1
  port: 6379
  db: 0

# SQL 安全治理参数（BR-SQL-001/003/004）
sql_security:
  max_execution_time_ms: 30000
  max_result_rows: 10000
  allowed_statement_prefixes:
    - SELECT
    - WITH
    - EXPLAIN
    - DESC
    - SHOW
    - DESCRIBE

# 可观测性（阶段 11 / NFR-OBS）。
observability:
  # 总开关。关掉之后进程里不再产生任何 span，连 FastAPI 的原生 telemetry 也一并
  # 关（见 app/core/tracing.py 的 telemetry_config）——所以它是真的"什么都不产生"，
  # 不是"产生了但我们不看"。
  enabled: true
  # 日志级别；也可用 OBSERVABILITY__LOG_LEVEL 覆盖
  log_level: INFO
  # 不依赖 Langfuse 的那条路：填了就把 span 同时送到任意 OTLP 后端
  # （自建 collector / Jaeger / Tempo…），HTTP 协议，地址通常以 /v1/traces 结尾。
  # 留空则只走 Langfuse；两者都不用就把上面的 enabled 关掉。
  #
  # 用这一项而**不**用 OTEL_EXPORTER_OTLP_ENDPOINT 环境变量：后者会被 FastAPI
  # 原生 telemetry 的自动配置读走并自行挂一个导出器，那等于"数据往哪儿发"由
  # 运行环境里一个不在本仓库里的变量决定（NFR-SEC-003 的同一条道理）。
  otlp_endpoint: ""

# Langfuse 追踪（LLM 调用、节点耗时、召回命中数）。
# PUBLIC_KEY / SECRET_KEY 只填在 .env（LANGFUSE__PUBLIC_KEY / LANGFUSE__SECRET_KEY），
# 不进本文件（NFR-SEC-003）。缺 key 时不报错，只是不再上报。
langfuse:
  enabled: true
  # 区域不同域名不同：EU 是 cloud.langfuse.com，US 是 us.cloud.langfuse.com。
  # 密钥只在它所属区域的域名下有效，填错了拿到的是 401，而不是一句说得清的报错
  host: https://cloud.langfuse.com
  timeout: 5
  # 允不允许把**内容**发出去——这一项管的是"往不往第三方发业务数据"，
  # 不是"发得多快"，所以与上面几项分开看：
  #   false（默认）：只上报结构信息（节点名、模型名、token 数、耗时、命中数）。
  #                  业务问题原文、生成的 SQL、查询结果一个字节都不出本机。
  #   true        ：提示词与模型输出原样上报，排查效率高得多，代价是业务数据出境。
  # 默认取保守的一侧，因为两个方向的纠错成本不对称：默认不传、需要时打开只是改一行
  # 配置；默认传了、事后才发现不该传，数据已经在别人的服务器上，删不回来。
  capture_content: false

# CORS 白名单，生产环境禁止通配符（NFR-SEC-006）
cors_origins:
  - http://localhost:5173
  - http://127.0.0.1:5173
