[project]
name = "data-agent"
version = "3.0.0"
description = "数据通达 — 面向企业内部数仓的 Text-to-SQL 智能数据问答 Agent"
requires-python = ">=3.12"
dependencies = [
    # 接口层
    "fastapi>=0.128",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.12",
    # 配置
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    # 存储层（meta + dw）
    "sqlalchemy[asyncio]>=2.0",
    "asyncmy>=0.2.9",
    "alembic>=1.14",
    # MySQL 8 默认认证插件 caching_sha2_password 在服务端缓存失效时（重启、FLUSH PRIVILEGES）
    # 要求客户端做 RSA 公钥加密，asyncmy 依赖 cryptography 提供该能力；缺失则直接连不上
    "cryptography>=42.0",
    # 认证（阶段 3）
    "pyjwt>=2.9",
    "bcrypt>=4.1",
    # 知识库构建（阶段 4）
    # httpx 同时承担 Embedding 服务的 HTTP 调用，以及接口验收的 ASGI transport
    "httpx>=0.27",
    "qdrant-client>=1.12",
    "elasticsearch[async]>=8.15,<9",
    # Agent 闭环（阶段 5）
    # langgraph 提供 StateGraph 与 Runtime（runtime.stream_writer 推 SSE 进度）；
    # langchain-openai 的 ChatOpenAI 直接对接 OpenAI 兼容端点（DeepSeek / Ollama 等），
    # 自带超时、重试与流式，不必手写 HTTP 客户端。只装 langchain-openai：
    # 它依赖 langchain-core，而重量级的 langchain 包（chains/agents 等）这里用不到。
    "langgraph>=1.0",
    "langchain-openai>=1.0",
    # SQL 只读校验用解析而非正则：正则挡不住 `WITH x AS (...) DELETE` 这类
    # SELECT 开头、实则写入的语句（MySQL 8 支持），必须按 token 类型判定（TDD 13）
    "sqlparse>=0.5",
]

# 以下依赖按开发阶段逐步启用（见《开发步骤文档》），避免过早引入未使用的重依赖：
#   阶段 6  混合检索    : 无需新增依赖——向量检索用 qdrant-client，全文检索用
#                        elasticsearch，重排走 httpx（均为已有依赖）。
#                        重排**服务**是独立进程，不装进本环境（ADR-005）
#   阶段 7  多轮会话    : redis[hiredis]
#   阶段 11 可观测      : loguru, opentelemetry-sdk, opentelemetry-instrumentation-fastapi, langfuse

[project.optional-dependencies]
# 开发/验收用：uv pip install -e ".[dev]"
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 夹具与测试共用一个会话级事件循环：app.clients 下的 Qdrant / ES 客户端是按进程
# 持有的单例，绑在创建它的事件循环上；每个测试各起一个循环会让单例在第二个测试里
# 变成"绑在已关闭循环上"的僵尸。
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    # 需要 MySQL/Qdrant/Elasticsearch/Embedding 全部在跑；没起时自动跳过（见 tests/conftest.py）
    "requires_stack: 需要完整外部服务栈（阶段 4 知识库验收）",
    # 需要 .env 里配好真实的 LLM__API_KEY；没配时自动跳过（见 tests/conftest.py）
    "requires_llm: 需要真实大模型服务（阶段 5 端到端验收）",
    # 需要 RERANK__HOST 指向一个真实的重排服务；没起时自动跳过。
    # 重排是可选依赖（没有它检索降级到 RRF 顺序），所以单独一个标记，
    # 不混进 requires_stack
    "requires_rerank: 需要真实重排服务（阶段 6 精排质量验收）",
]
