# NOTE: keep this file ASCII-only.
# Alembic reads it with encoding="locale" (GBK on a Chinese Windows), so non-ASCII
# comments here would raise UnicodeDecodeError before migrations even start.
# Chinese documentation lives in alembic/env.py instead.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is injected by alembic/env.py from the app config
# (it carries a secret password, so it must not live in this file).
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
